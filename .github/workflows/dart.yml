name: iOS Test Build (No Sign)

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v3

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      # Fix Podfile platform issue
      - name: Fix Podfile
        run: |
          echo "platform :ios, '13.0'" | cat - ios/Podfile > temp && mv temp ios/Podfile

      # Clean old pods
      - name: Clean Pods
        run: |
          rm -rf ios/Pods ios/Podfile.lock

      # Install pods properly
      - name: Install Pods
        run: |
          cd ios
          pod install --repo-update

      # Build without signing (important fix)
      - name: Build iOS (no signing)
        run: |
          cd ios
          xcodebuild -workspace Runner.xcworkspace \
          -scheme Runner \
          -configuration Release \
          -sdk iphoneos \
          -destination 'generic/platform=iOS' \
          CODE_SIGNING_ALLOWED=NO

      # Create IPA manually
      - name: Create IPA
        run: |
          mkdir Payload
          cp -r ios/build/Release-iphoneos/Runner.app Payload/
          zip -r app.ipa Payload

      # Upload artifact
      - name: Upload IPA
        uses: actions/upload-artifact@v3
        with:
          name: ios-ipa
          path: app.ipa
